<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Mobile optimization & prevents zooming which breaks RTS controls -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Mobile OS Theming -->
    <meta name="theme-color" content="#120a05">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Command the Black Swarm in this spooky SimAnt and StarCraft inspired RTS.">
    
    <title>Pumpkin Patch RTS</title>
    
    <!-- Quick Emoji Favicon (No extra network request needed!) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Game UI (Populated by ContextUIExpansion in JS) -->
    <div id="ui">
        <div id="debug"></div>
    </div>

    <!-- The actual game rendering layer -->
    <canvas id="gameCanvas"></canvas>

    <!-- 
        type="module" enables ES6 imports/exports for your expansion files.
        (Modules are automatically deferred by the browser)
    -->
    <script type="module" src="main.js"></script>

</body>
</html>
