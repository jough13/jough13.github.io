<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document Configuration -->
    <meta charset="UTF-8">
    
    <!-- Mobile & PWA Optimization: Locks zooming, handles notches, and sets the OS bar color -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050200">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Lore & SEO Metadata -->
    <meta name="description" content="Command the Obsidian Brood to victory against the Crimson Swarm in SpiderWars! A retro 16-bit RTS of webs, magic, and survival.">
    <meta name="author" content="SpiderWars Dev">
    <title>SpiderWars!</title>

    <!-- Social Media / OpenGraph Meta Tags (Expandability for sharing) -->
    <meta property="og:title" content="SpiderWars!">
    <meta property="og:description" content="Command the Obsidian Brood against the Crimson Swarm in this retro 16-bit RTS.">
    <meta property="og:type" content="website">

    <!-- Dynamic SVG Favicon (Updated to a Spider to match the new title) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
    
    <!-- Performance: Preload critical assets before rendering blocks -->
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="main.js" as="script" crossorigin="anonymous">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>
<!-- Inline styles prevent the dreaded "white flash" while loading on slow connections -->
<body style="background-color: #050200; overflow: hidden; margin: 0; padding: 0;">

    <!-- Fallback for players with JavaScript disabled -->
    <noscript>
        <div style="color: #ff9d00; text-align: center; margin-top: 20%; font-family: 'Courier New', Courier, monospace;">
            <h1>JavaScript is Required</h1>
            <p>The Obsidian Brood slumbers. Please enable JavaScript to awaken the swarm.</p>
        </div>
    </noscript>

    <!-- 
        The actual game rendering layer.
        Added aria-labels for screen readers and hardcoded right-click prevention.
    -->
    <canvas id="gameCanvas" aria-label="SpiderWars Game Area" role="application" oncontextmenu="return false;"></canvas>

    <!-- Game Engine & Modular Expansions (Type 'module' allows top-level imports) -->
    <script type="module" src="main.js"></script>

</body>
</html>
