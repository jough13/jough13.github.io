<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document Configuration -->
    <meta charset="UTF-8">
    
    <!-- 📱 Mobile & PWA Optimization: Locks zooming, handles notches (viewport-fit=cover), and sets OS bar color -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050200">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Future PWA Support (Allows players to install the game to their home screen) -->
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="assets/queen_black.png">
    
    <!-- 📖 Lore & SEO Metadata -->
    <meta name="description" content="Command the Obsidian Brood to victory against the Crimson Swarm in SpiderWars! A retro 16-bit RTS of webs, magic, and survival.">
    <meta name="author" content="SpiderWars Dev">
    <title>SpiderWars!</title>

    <!-- Social Media / OpenGraph Meta Tags -->
    <meta property="og:title" content="SpiderWars!">
    <meta property="og:description" content="Command the Obsidian Brood against the Crimson Swarm in this retro 16-bit RTS.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/queen_black.png">
    
    <!-- Twitter/Discord Rich Embed Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SpiderWars!">
    <meta name="twitter:description" content="Command the Obsidian Brood against the Crimson Swarm in this retro 16-bit RTS.">
    <meta name="twitter:image" content="assets/queen_black.png">

    <!-- Schema.org JSON-LD for Game SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "SpiderWars!",
      "description": "Command the Obsidian Brood to victory against the Crimson Swarm in SpiderWars! A retro 16-bit RTS of webs, magic, and survival.",
      "genre": ["Real-Time Strategy", "RTS", "Indie"],
      "playMode": "SinglePlayer",
      "applicationCategory": "Game"
    }
    </script>

    <!-- Dynamic SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
    
    <!-- 🚀 Performance: Preload CSS and properly Module-Preload the JS Engine -->
    <link rel="preload" href="style.css" as="style">
    <link rel="modulepreload" href="main.js">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">

    <!-- 🔌 EXPANDABILITY: Global Modding API Initialization -->
    <script>
        // Any external JS mods loaded in this HTML file can push their modules into this array.
        // main.js will automatically detect and append them to the boot sequence!
        window.SpiderWarsMods = [];
    </script>

    <style>
        /* Inline CSS for the Pre-Boot Loader to ensure it renders instantly without waiting for style.css */
        #preBootLoader {
            position: fixed; inset: 0; background: #050200; z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ff9d00; font-family: 'Courier New', Courier, monospace;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        /* 🧃 JUICE: Arcane Spider Glyph dual-ring spinner */
        .spider-glyph {
            position: relative; width: 60px; height: 60px; margin-bottom: 25px;
            border: 4px solid transparent; border-top-color: #aa00ff; border-bottom-color: #aa00ff;
            border-radius: 50%;
            animation: spinEngine 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.4);
        }
        .spider-glyph::before {
            content: ""; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 4px solid transparent; border-left-color: #ff9d00; border-right-color: #ff9d00;
            border-radius: 50%;
            animation: spinEngine 2s linear infinite reverse;
        }
        
        @keyframes spinEngine { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes textPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 15px #ff9d00; } }
        
        .loader-text { animation: textPulse 2s infinite; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px;}
    </style>
</head>

<body style="background-color: #050200; overflow: hidden; margin: 0; padding: 0; touch-action: none;">

    <!-- 1. INSTANT PRE-BOOT LOADER (Fades out when main.js finishes parsing) -->
    <div id="preBootLoader" aria-hidden="true">
        <div class="spider-glyph"></div>
        <div class="loader-text">Weaving Engine...</div>
    </div>

    <!-- 2. NO-JS FALLBACK -->
    <noscript>
        <div style="position: absolute; z-index: 9999999; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff9d00; text-align: center; font-family: 'Courier New', Courier, monospace; background: rgba(5,2,0,0.95); padding: 30px; border: 3px solid #ff9d00; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,1);">
            <h1 style="margin-top: 0; text-transform: uppercase; font-size: 24px;">JavaScript is Required</h1>
            <p style="font-size: 16px; margin-bottom: 0; color: #dfba96;">The Obsidian Brood slumbers. Please enable JavaScript to awaken the swarm.</p>
        </div>
    </noscript>

    <!-- 3. MAIN GAME CANVAS -->
    <canvas id="gameCanvas" aria-label="SpiderWars Game Area" role="application" tabindex="0" oncontextmenu="return false;" style="touch-action: none; outline: none;"></canvas>

    <!-- 🔌 4. MODDING UI HOOK LAYER -->
    <!-- Guaranteed top-level container for mods to inject custom UI without breaking canvas logic -->
    <div id="mod-layer" style="position: absolute; inset: 0; pointer-events: none; z-index: 9000;"></div>

    <!-- 5. ENGINE BOOT SCRIPT -->
    <script type="module" src="main.js"></script>

    <!-- 6. PRE-BOOT CLEANUP & FAIL-SAFE LOGIC -->
    <script>
        // Listens for the custom event we added to main.js earlier!
        window.addEventListener('SpiderWarsReady', () => {
            const loader = document.getElementById('preBootLoader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500); // Remove from DOM safely after fade
            }
        });

        // 🛡️ [FIX] Engine Boot Fail-Safe!
        // If 10 seconds pass and the engine hasn't broadcast its ready signal, display a fatal error
        // instead of leaving the user trapped staring at a spinning web forever.
        setTimeout(() => {
            const loader = document.getElementById('preBootLoader');
            if (loader && !window.SpiderWarsEngine) {
                loader.style.animation = 'none'; // Stop spinning
                loader.innerHTML = `
                    <div style="color: #ff0000; text-align: center; background: rgba(20,0,0,0.8); padding: 20px; border: 2px solid #ff0000; border-radius: 8px;">
                        <h2 style="margin: 0 0 10px 0; text-transform: uppercase;">🕸️ The Web Snapped</h2>
                        <p style="margin: 0; color: #fff;">A fatal error prevented the engine from booting.</p>
                        <p style="margin: 5px 0 0 0; font-size: 0.9em; color: #dfba96;">Please check the browser console (F12) for details.</p>
                    </div>
                `;
            }
        }, 10000);
    </script>

</body>
</html>
