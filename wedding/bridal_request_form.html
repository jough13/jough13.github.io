<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Posh Salon - Bridal Request</title>
  
  <!-- React and ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary-color: #4A235A;
      --secondary-color: #6C3483;
      --bg-color: #f8f6fa;
      --text-color: #333;
    }

    body {
      background-color: var(--bg-color);
      padding: 20px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: var(--text-color);
      margin: 0;
    }

    .bridal-form-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
      background: #ffffff;
      box-shadow: 0 8px 16px rgba(74, 35, 90, 0.1);
      border-radius: 8px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
      color: var(--primary-color);
    }

    .form-header h2 {
      font-weight: 300;
      letter-spacing: 3px;
      margin: 0;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    .form-header h1 {
      font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
      font-size: 4rem;
      font-weight: normal;
      margin: -10px 0 0 0;
    }

    .bridal-form {
      border: 3px solid var(--primary-color);
      padding: 30px;
      border-radius: 4px;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .input-group label {
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      text-transform: uppercase;
      color: var(--primary-color);
    }

    .input-group input[type="text"],
    .input-group input[type="tel"],
    .input-group input[type="email"],
    .input-group input[type="date"],
    .input-group input[type="time"] {
      flex-grow: 1;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      padding: 8px 5px;
      font-size: 1rem;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.3s;
      min-width: 200px;
    }

    .input-group input:focus {
      border-bottom: 2px solid var(--secondary-color);
    }

    .grid-2-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .checkbox-group {
      display: flex;
      gap: 30px;
      margin: 25px 0;
      align-items: center;
      flex-wrap: wrap;
    }

    .checkbox-group label {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--primary-color);
      padding: 5px 0;
    }

    .checkbox-group input[type="checkbox"],
    .checkbox-group input[type="radio"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .services-line {
      flex-grow: 1;
      border-bottom: 1px solid #ccc;
      margin-left: 10px;
      min-width: 50px;
    }
    
    .service-label {
      flex-grow: 1; 
      display: flex;
      min-width: 150px;
    }

    .bottom-sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 40px;
    }

    .section-box {
      border: 2px solid var(--primary-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      background-color: #faf9fc;
    }

    .section-box label.box-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1rem;
      color: var(--primary-color);
      text-transform: uppercase;
    }

    .section-box textarea {
      width: 100%;
      border: none;
      resize: vertical;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 1rem;
      flex-grow: 1;
      color: var(--text-color);
      padding: 5px;
      box-sizing: border-box;
    }

    .right-panels {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .agreement-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .agreement-row {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }
    
    .agreement-row label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary-color);
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      flex-grow: 1;
      padding: 15px;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      box-sizing: border-box;
      display: inline-block;
      min-width: 150px;
    }

    .submit-btn {
      background-color: var(--primary-color);
      color: white;
    }

    .submit-btn:hover {
      background-color: var(--secondary-color);
      box-shadow: 0 4px 8px rgba(108, 52, 131, 0.3);
    }

    .load-file-input {
      display: none;
    }

    .load-btn {
      background-color: var(--secondary-color);
      color: white;
      width: 100%;
      margin: 0;
    }

    .load-btn:hover {
      background-color: var(--primary-color);
      box-shadow: 0 4px 8px rgba(108, 52, 131, 0.3);
    }

    .print-btn {
      background-color: #e8e3ec;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
    }

    .print-btn:hover {
      background-color: #d1c4e0;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      .bridal-form-container {
        padding: 20px;
      }

      .bridal-form {
        padding: 15px;
      }

      .form-header h1 {
        font-size: 3rem;
      }

      .grid-2-col {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .bottom-sections {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .input-group {
        flex-direction: column;
        align-items: flex-start;
      }

      .input-group input[type="text"],
      .input-group input[type="tel"],
      .input-group input[type="email"],
      .input-group input[type="date"],
      .input-group input[type="time"] {
        width: 100%;
        box-sizing: border-box;
      }

      .checkbox-group {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .agreement-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background-color: white;
        padding: 0;
      }
      .bridal-form-container {
        box-shadow: none;
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .section-box {
        background-color: white;
      }
      input, textarea {
        color: black !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const BridalRequestForm = () => {
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        email: '',
        dateOfEvent: '',
        venue: '',
        locationType: '',
        services: {
          hair: false,
          makeup: false,
        },
        targetFinishTime: '',
        weddingPlanner: '',
        notes: '',
        agreement: {
          sent: false,
          signed: false,
          cardOnFile: false,
          depositRun: false,
        },
        partyMembers: ''
      });

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        
        if (type === 'checkbox') {
          if (['hair', 'makeup'].includes(name)) {
            setFormData(prev => ({
              ...prev,
              services: { ...prev.services, [name]: checked }
            }));
          } else if (['sent', 'signed', 'cardOnFile', 'depositRun'].includes(name)) {
            setFormData(prev => ({
              ...prev,
              agreement: { ...prev.agreement, [name]: checked }
            }));
          }
        } else if (type === 'radio') {
          setFormData(prev => ({ ...prev, locationType: value }));
        } else {
          setFormData(prev => ({ ...prev, [name]: value }));
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        
        const safeName = formData.name 
          ? formData.name.trim().replace(/[^a-zA-Z0-9]/g, '_') 
          : 'New_Client';
        
        const today = new Date();
        const dateString = today.toISOString().split('T')[0];
        const fileName = `${safeName}_${dateString}.json`;

        const jsonString = JSON.stringify(formData, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      };

      const handleLoad = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsedData = JSON.parse(event.target.result);
            setFormData(prevData => ({
              ...prevData,
              ...parsedData,
              services: { ...prevData.services, ...(parsedData.services || {}) },
              agreement: { ...prevData.agreement, ...(parsedData.agreement || {}) }
            }));
          } catch (error) {
            alert('Error parsing the file. Please ensure it is a valid saved form JSON.');
            console.error('File parsing error:', error);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handlePrint = (e) => {
        e.preventDefault();
        window.print();
      };

      return (
        <div className="bridal-form-container">
          <div className="form-header">
            <h2>Posh Salon</h2>
            <h1>Bridal Request</h1>
          </div>

          <form onSubmit={handleSave} className="bridal-form">
            <div className="input-group">
              <label>NAME:</label>
              <input type="text" name="name" value={formData.name} onChange={handleChange} />
            </div>

            <div className="grid-2-col">
              <div className="input-group">
                <label>PHONE:</label>
                <input type="tel" name="phone" value={formData.phone} onChange={handleChange} />
              </div>
              <div className="input-group">
                <label>EMAIL:</label>
                <input type="email" name="email" value={formData.email} onChange={handleChange} />
              </div>
            </div>

            <div className="grid-2-col">
              <div className="input-group">
                <label>DATE OF EVENT:</label>
                <input type="date" name="dateOfEvent" value={formData.dateOfEvent} onChange={handleChange} />
              </div>
              <div className="input-group">
                <label>VENUE:</label>
                <input type="text" name="venue" value={formData.venue} onChange={handleChange} />
              </div>
            </div>

            <div className="checkbox-group">
              <label>
                <input type="radio" name="locationType" value="in-salon" 
                       checked={formData.locationType === 'in-salon'} onChange={handleChange} />
                IN-SALON
              </label>
              <label>
                <input type="radio" name="locationType" value="on-location" 
                       checked={formData.locationType === 'on-location'} onChange={handleChange} />
                ON-LOCATION
              </label>
            </div>

            <div className="checkbox-group" style={{marginTop: '10px'}}>
              <label className="service-label">
                <input type="checkbox" name="hair" checked={formData.services.hair} onChange={handleChange} />
                HAIR <span className="services-line"></span>
              </label>
              <label className="service-label">
                <input type="checkbox" name="makeup" checked={formData.services.makeup} onChange={handleChange} />
                MAKEUP <span className="services-line"></span>
              </label>
            </div>

            <div className="input-group" style={{marginTop: '30px'}}>
              <label>TARGET FINISH TIME:</label>
              <input type="time" name="targetFinishTime" value={formData.targetFinishTime} onChange={handleChange} style={{maxWidth: '150px'}} />
            </div>

            <div className="input-group">
              <label>WEDDING PLANNER:</label>
              <input type="text" name="weddingPlanner" value={formData.weddingPlanner} onChange={handleChange} />
            </div>

            <div className="bottom-sections">
              <div className="section-box">
                <label className="box-title">Notes:</label>
                <textarea name="notes" value={formData.notes} onChange={handleChange} rows="10"></textarea>
              </div>

              <div className="right-panels">
                <div className="section-box">
                  <label className="box-title">AGREEMENT</label>
                  <div className="agreement-checkboxes">
                    <div className="agreement-row">
                      <label>
                        <input type="checkbox" name="sent" checked={formData.agreement.sent} onChange={handleChange} />
                        Sent
                      </label>
                      <label>
                        <input type="checkbox" name="signed" checked={formData.agreement.signed} onChange={handleChange} />
                        Signed & Received
                      </label>
                    </div>
                    <div className="agreement-row">
                      <label>
                        <input type="checkbox" name="cardOnFile" checked={formData.agreement.cardOnFile} onChange={handleChange} />
                        CARD ON FILE
                      </label>
                    </div>
                    <div className="agreement-row">
                      <label>
                        <input type="checkbox" name="depositRun" checked={formData.agreement.depositRun} onChange={handleChange} />
                        DEPOSIT RUN
                      </label>
                    </div>
                  </div>
                </div>

                <div className="section-box" style={{flexGrow: 1}}>
                  <label className="box-title">PARTY MEMBERS:</label>
                  <textarea name="partyMembers" value={formData.partyMembers} onChange={handleChange} rows="4"></textarea>
                </div>
              </div>
            </div>

            <div className="button-group no-print">
              <button type="submit" className="btn submit-btn">Save Request</button>
              
              <div style={{flexGrow: 1, display: 'flex'}}>
                <input 
                  type="file" 
                  id="load-file" 
                  className="load-file-input" 
                  accept=".json"
                  onChange={handleLoad} 
                />
                <label htmlFor="load-file" className="btn load-btn">Load Request</label>
              </div>

              <button type="button" onClick={handlePrint} className="btn print-btn">Print Form</button>
            </div>
          </form>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BridalRequestForm />);
  </script>
</body>
</html>
